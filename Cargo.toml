[package]
name = "ftth-lia-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal", "time"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
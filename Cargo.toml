[package]
name = "ftth-lia-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = "0.4"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"
similar = "2"
axum = "0.8"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }